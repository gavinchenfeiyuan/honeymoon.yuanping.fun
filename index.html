<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>矩形块</title>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>

  <!-- 临时版本号：辨认变更用，确认后删掉这一行即可 -->
  <div id="ver"
    style="position:fixed;top:6px;right:8px;z-index:99999;font:12px/1.4 monospace;color:#222;background:rgba(255,255,255,.88);border:1px solid #999;border-radius:4px;padding:3px 6px;pointer-events:none;">
    v0.29</div>

  <!-- 第一块：竖向 4:3 地图画框（行程点位 + 路线） -->
  <section class="block block-first" id="map-block">
    <div id="map-frame">
      <div id="map"></div>
      <div id="map-err"></div>
      <div id="map-hint">地图加载中…<br />若空白，请在 index.html 底部填入高德 Web JS API 的 key 与安全密钥</div>
    </div>
  </section>

  <section class="block">BBBB</section>
  <section class="block">CCCC</section>
  <section class="block">DDDD</section>

  <!-- 高德安全密钥：必须在加载 JS API 之前设置 -->
  <script>
    window._AMapSecurityConfig = { securityJsCode: "8fa56ff20532321e38b42a31b32ed125" };
  </script>

  <!-- 地图初始化（高德 JS API 加载完成后回调） -->
  <script>
    function onAMapLoaded() {
      // 显式给出中心点，避免默认中心在极端情况下为 NaN
      var map = new AMap.Map("map", {
        zoom: 5,
        center: [116.397, 39.909],
        viewMode: "2D"
      });
      var hint = document.getElementById("map-hint");
      if (hint) hint.style.display = "none";

      // 底图用浅色预置（远山黛），保证可读
      try { map.setMapStyle("amap://styles/whitesmoke"); } catch (e) { }
      if (map && map.on) map.on("complete", function () {
        try { map.setMapStyle("amap://styles/whitesmoke"); } catch (e) { }
      });

      var pointsAdded = false;
      function addPoints() {
        if (pointsAdded) return;   // 防止 complete 事件与兜底定时器重复添加
        pointsAdded = true;
        // 并行加载：path.json 提供点位顺序，place.json 提供坐标
        Promise.all([
          fetch("path.json").then(function (r) {
            if (!r.ok) throw new Error("path.json HTTP " + r.status);
            return r.json();
          }),
          fetch("place.json").then(function (r) {
            if (!r.ok) throw new Error("place.json HTTP " + r.status);
            return r.json();
          })
        ]).then(function (results) {
          var plan = (results[0] && results[0].plan) || [];
          var places = (results[1] && results[1].place) || [];
          if (!plan.length) { console.warn("path.json 没有 plan"); return; }
          // name -> place 查找表
          var placeMap = {};
          places.forEach(function (p) {
            if (p && p.name && !placeMap[p.name]) placeMap[p.name] = p;
          });
          var markers = [];
          var infoWindow = null;
          var missing = [];
          var dayPoints = [];   // {lng,lat,date} 按 plan 顺序，用于按天分段着色
          // 严格按 plan 顺序打点
          plan.forEach(function (item, i) {
            var name = item && item.name;
            if (!name || name === "overnight") return;   // 跳过住宿/占位项
            var place = placeMap[name];
            if (!place) {
              missing.push(name);
              console.error("plan 点位「" + name + "」(#" + i + ") 在 place.json 中未找到");
              return;
            }
            var lng = Number(place.lng), lat = Number(place.lat);
            if (!isFinite(lng) || !isFinite(lat)) {
              missing.push(name);
              console.error("plan 点位「" + name + "」坐标无效", place);
              return;
            }
            try {
              var m = new AMap.Marker({
                position: [lng, lat],
                anchor: "bottom-center",
                // 自定义标记：红圆点 + 点位名称（plan.name）
                content:
                  '<div class="map-dot-wrap">' +
                  '<span class="map-dot-name">' + name + '</span>' +
                  '<span class="map-dot"></span>' +
                  '</div>',
                map: map
              });
              // 点击标记弹出信息窗（显示名称 + 位置）
              m.on("click", function () {
                if (infoWindow) infoWindow.close();
                infoWindow = new AMap.InfoWindow({
                  content:
                    '<div style="font:14px/1.6 system-ui,-apple-system,\'Noto Sans SC\',sans-serif;padding:2px 4px;color:#222;">' +
                    '<strong>' + name + '</strong>' +
                    (place.location ? '<br>' + place.location : '') +
                    '</div>',
                  offset: new AMap.Pixel(0, -32)
                });
                infoWindow.open(map, [lng, lat]);
              });
              markers.push(m);
              dayPoints.push({
                lng: lng,
                lat: lat,
                date: String(item.date || "").slice(0, 6)   // 归一化为 YYMMDD
              });
            } catch (e) {
              console.warn("点位「" + name + "」创建失败:", e && e.message);
            }
          });
          // 缺失点位：控制台报错 + 地图底部红字提示
          if (missing.length) {
            var errEl = document.getElementById("map-err");
            if (errEl) {
              errEl.style.display = "block";
              errEl.textContent = missing.length + " 个点位在 place.json 中未找到：" + missing.join("、");
            }
            console.error("缺失点位汇总：", missing);
          }
          // 路线：按 plan 顺序、按 date 分段，每段一条贝塞尔曲线，同 date 同色
          if (dayPoints.length > 1) {
            // ① 按 date 切段（跨天线段归到新一天）
            var segs = [];
            var cur = { date: dayPoints[0].date, pts: [[dayPoints[0].lng, dayPoints[0].lat]] };
            for (var si = 1; si < dayPoints.length; si++) {
              var dp = dayPoints[si];
              if (dp.date !== cur.date && cur.pts.length >= 2) {
                segs.push(cur);
                cur = { date: dp.date, pts: [cur.pts[cur.pts.length - 1]] };
              }
              cur.pts.push([dp.lng, dp.lat]);
            }
            if (cur.pts.length >= 2) segs.push(cur);

            // ② 颜色分配：同 date 复用同色，不同 date 随机取 64 色秋景库，再叠灰蒙版变灰
            function grayMix(rgb, t) {
              var m = (rgb || "").match(/rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/);
              if (!m) return rgb;
              var r = +m[1], g = +m[2], b = +m[3];
              var nr = Math.round(r + (128 - r) * t);
              var ng = Math.round(g + (128 - g) * t);
              var nb = Math.round(b + (128 - b) * t);
              return "rgb(" + nr + "," + ng + "," + nb + ")";
            }
            var dateColors = {};
            function colorOf(d) {
              if (!dateColors[d]) {
                var cn = Math.floor(Math.random() * 64) + 1;   // 随机 64 色秋景
                dateColors[d] = grayMix(pickColor(cn), 0.5);   // 叠 50% 灰蒙版
              }
              return dateColors[d];
            }

            // ③ 每段画一条平滑曲线（Catmull-Rom 转三次贝塞尔）
            segs.forEach(function (seg) {
              var pts = seg.pts;
              var curvePath = [];
              for (var j = 0; j < pts.length - 1; j++) {
                var p0 = pts[Math.max(0, j - 1)];
                var p1 = pts[j];
                var p2 = pts[j + 1];
                var p3 = pts[Math.min(pts.length - 1, j + 2)];
                curvePath.push([
                  p1,
                  [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6],
                  [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6],
                  p2
                ]);
              }
              if (curvePath.length) {
                new AMap.BezierCurve({
                  path: curvePath,
                  strokeColor: colorOf(seg.date),
                  strokeWeight: 3,
                  strokeOpacity: 0.85,
                  map: map
                });
              }
            });
          }
          if (markers.length) {
            // setFitView 自动按所有标记框定视野，比手动 setBounds 更稳
            try { map.setFitView(markers, false, [40, 40, 40, 40]); }
            catch (e) { console.warn("setFitView:", e); }
          }
          // 点地图空白处关闭信息窗
          map.on("click", function () { if (infoWindow) infoWindow.close(); });
          setTimeout(function () { try { map.resize(); } catch (e) { } }, 150);
        }).catch(function (e) { console.error("读取 path.json / place.json 失败", e); });
      }

      // 等地图投影“完成”再上点，避免渲染时序导致的 NaN；
      // 同时加一个短定时器兜底（complete 可能已提前触发而漏接）
      if (map) {
        map.on("complete", addPoints);
        setTimeout(addPoints, 600);
      }

      // 尺寸兜底：加载后 & 窗口尺寸变化时重算瓦片
      window.addEventListener("resize", function () { try { map.resize(); } catch (e) { } });
      setTimeout(function () {
        try { map.resize(); } catch (e) { }
      }, 300);
    }
  </script>

  <!-- 高德 JS API：把 你的高德KEY 换成你自己的 Web 端 JS API key -->
  <!-- crossorigin 让跨域脚本的真实报错暴露出来（否则只显示 Script error.） -->
  <script crossorigin="anonymous"
    src="https://webapi.amap.com/maps?v=2.0&key=2a061f322f0cbaba1b5bf0a796fc422c&callback=onAMapLoaded"
    onerror="window.__mapErr = true;"></script>

  <!-- 其余块：从 64 种秋景配色随机上色（地图块除外） -->
  <script>
    // 取 .cN 类对应的背景色（用于给地图边框上色）
    function pickColor(n) {
      var tmp = document.createElement("div");
      tmp.className = "c" + n;
      tmp.style.display = "none";
      document.body.appendChild(tmp);
      var col = getComputedStyle(tmp).backgroundColor;
      document.body.removeChild(tmp);
      return col;
    }

    // 地图画框：厚边框，颜色从 64 色库随机抽
    var mb = document.getElementById("map-frame");
    if (mb) {
      var bn = Math.floor(Math.random() * 64) + 1;
      mb.style.borderColor = pickColor(bn);
    }

    // 其余矩形块：随机上色
    document.querySelectorAll(".block:not(#map-block)").forEach(function (b) {
      var n = Math.floor(Math.random() * 64) + 1;
      b.classList.add("c" + n);
    });
  </script>

</body>

</html>
