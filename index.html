<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>矩形块</title>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>

  <!-- 第一块：竖向 4:3 地图画框（行程点位 + 路线） -->
  <section class="block block-first" id="map-block">
    <div id="map-frame">
      <div id="map"></div>
      <div id="map-err"></div>
      <div id="map-hint">地图加载中…<br />若长时间空白，请检查网络或高德 key 配置</div>
      <!-- 网站大标题：左下角印章式——漠岭/松桦两列竖排 + 版本号横排落款 -->
      <div id="site-title">
        <span class="st-col">漠岭</span>
        <span class="st-col">松桦</span>
      </div>
      <div id="ver-tag">v0.54</div>
    </div>
  </section>

  <section class="block">BBBB</section>
  <section class="block">CCCC</section>
  <section class="block">DDDD</section>

  <!-- 高德安全密钥：必须在加载 JS API 之前设置 -->
  <script>
    window._AMapSecurityConfig = { securityJsCode: "8fa56ff20532321e38b42a31b32ed125" };
  </script>

  <!-- 地图初始化（高德 JS API 加载完成后回调） -->
  <script>
    function onAMapLoaded() {
      // 显式给出中心点，避免默认中心在极端情况下为 NaN
      var map = new AMap.Map("map", {
        zoom: 5,
        center: [116.397, 39.909],
        viewMode: "2D"
      });
      var hint = document.getElementById("map-hint");
      if (hint) hint.style.display = "none";

      // 底图用浅色预置（远山黛），保证可读
      try { map.setMapStyle("amap://styles/whitesmoke"); } catch (e) { }
      if (map && map.on) map.on("complete", function () {
        try { map.setMapStyle("amap://styles/whitesmoke"); } catch (e) { }
      });

      var pointsAdded = false;
      // YYMMDD -> "2026年9月12日"
      function fmtDate(d) {
        if (!d || d.length < 6) return "";
        return (2000 + (+d.slice(0, 2))) + "年" + (+d.slice(2, 4)) + "月" + (+d.slice(4, 6)) + "日";
      }
      function addPoints() {
        if (pointsAdded) return;   // 防止 complete 事件与兜底定时器重复添加
        pointsAdded = true;
        // 同 date 同色：从 16 色配色库随机取底色（不同日期不撞色），再叠蒙版淡化（与白混合）
        var dateColors = {};
        var usedColors = {};
        function fadeWithWhite(rgb, t) {
          var m = (rgb || "").match(/rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/);
          if (!m) return rgb;
          var r = +m[1], g = +m[2], b = +m[3];
          var nr = Math.round(r + (255 - r) * t);
          var ng = Math.round(g + (255 - g) * t);
          var nb = Math.round(b + (255 - b) * t);
          return "rgb(" + nr + "," + ng + "," + nb + ")";
        }
        function colorOf(date) {
          if (!dateColors[date]) {
            var bg = null, guard = 0;
            while (!bg || usedColors[bg]) {
              var tmp = document.createElement("div");
              tmp.className = "c" + (Math.floor(Math.random() * 16) + 1);
              tmp.style.display = "none";
              document.body.appendChild(tmp);
              bg = getComputedStyle(tmp).backgroundColor;
              document.body.removeChild(tmp);
              if (++guard > 30) break;   // 兜底：色表用尽时不再强求不撞色
            }
            usedColors[bg] = true;
            dateColors[date] = fadeWithWhite(bg, 0.5);   // 叠 50% 白色蒙版淡化
          }
          return dateColors[date];
        }
        // 并行加载：path.json（plan 点位）+ county.json（county 行政边界）
        Promise.all([
          fetch("path.json").then(function (r) {
            if (!r.ok) throw new Error("path.json HTTP " + r.status);
            return r.json();
          }),
          fetch("county.json").then(function (r) {
            if (!r.ok) throw new Error("county.json HTTP " + r.status);
            return r.json();
          }).catch(function () { return {}; })   // county.json 缺失不阻塞地图
        ]).then(function (results) {
          var data = results[0];
          var countyFile = results[1] || {};
          var plan = (data && data.plan) || [];
          if (!plan.length) { console.warn("path.json 没有 plan"); return; }
          var markers = [];
          var infoWindow = null;
          var bad = [];       // coordinate 缺失/格式异常的点
          var dayPoints = []; // {lng,lat,date} 按 plan 顺序，用于绘制路线
          // 严格按 plan 顺序打点
          plan.forEach(function (item, i) {
            var name = item && item.name;
            if (!name) return;
            var parts = String(item.coordinate || "").split(",");
            var lng = Number(parts[0]), lat = Number(parts[1]);
            if (!isFinite(lng) || !isFinite(lat)) {
              bad.push(name);
              console.error("plan 点位「" + name + "」(#" + i + ") coordinate 无效", item.coordinate);
              return;
            }
            try {
              // 地名背景框颜色：同 date 同色（淡化后）
              var dayColor = colorOf(String(item.date || "").slice(0, 6));
              var m = new AMap.Marker({
                position: [lng, lat],
                anchor: "bottom-center",
                zIndex: 10,
                // 自定义标记：圆点 + 点位名称（背景框按日期同色）
                content:
                  '<div class="map-dot-wrap">' +
                  '<span class="map-dot-name" style="background:' + dayColor + '">' + name + '</span>' +
                  '<span class="map-dot' + (item.arrived ? ' arrived' : '') + '"></span>' +
                  '</div>',
                map: map
              });
              // 点击标记弹出信息窗（名称 + 行政区划 + 日期 + 备注）
              m.on("click", function () {
                if (infoWindow) infoWindow.close();
                var lines =
                  '<strong>' + name + '</strong>' +
                  ((item.city || item.county) ? '<br>' + [item.city, item.county].filter(Boolean).join(" · ") : "") +
                  (item.date ? '<br>' + fmtDate(item.date) : "") +
                  (item.note ? '<br>' + item.note : "");
                infoWindow = new AMap.InfoWindow({
                  content:
                    '<div style="font:14px/1.6 system-ui,-apple-system,\'Noto Sans SC\',sans-serif;padding:2px 4px;color:#222;">' +
                    lines + '</div>',
                  offset: new AMap.Pixel(0, -32)
                });
                infoWindow.open(map, [lng, lat]);
              });
              markers.push(m);
              dayPoints.push({
                lng: lng,
                lat: lat,
                date: String(item.date || "").slice(0, 6),   // 归一化为 YYMMDD
                arrived: item.arrived === true,
                transportation: String(item.transportation || "").trim()
              });
            } catch (e) {
              console.warn("点位「" + name + "」创建失败:", e && e.message);
            }
          });
          // 无效坐标点位：控制台报错 + 地图底部红字提示
          if (bad.length) {
            var errEl = document.getElementById("map-err");
            if (errEl) {
              errEl.style.display = "block";
              errEl.textContent = bad.length + " 个点位 coordinate 无效：" + bad.join("、");
            }
            console.error("无效坐标点位汇总：", bad);
          }
          // 路线（落叶松）：夏=林海翠（未走），秋=松金（已走）
          if (dayPoints.length > 1) {
            var ROUTE_TODO = "#3A9268";   // 未走：林海翠（夏·落叶松）
            var ROUTE_DONE = "#E0A62E";   // 已走：松金（秋·落叶松）
            for (var si = 0; si < dayPoints.length - 1; si++) {
              var segFrom = dayPoints[si], segTo = dayPoints[si + 1];
              new AMap.Polyline({
                path: [[segFrom.lng, segFrom.lat], [segTo.lng, segTo.lat]],
                strokeColor: segFrom.arrived ? ROUTE_DONE : ROUTE_TODO,
                strokeWeight: segFrom.arrived ? 4 : 3,
                strokeOpacity: 0.85,
                zIndex: segFrom.arrived ? 6 : 5,
                map: map
              });
              // 交通方式：plan.transportation 非空时，显示在该点前面进入线路的正中间
              if (segTo.transportation) {
                new AMap.Marker({
                  position: [(segFrom.lng + segTo.lng) / 2, (segFrom.lat + segTo.lat) / 2],
                  anchor: "center",
                  zIndex: 7,
                  content: '<span class="map-transport">' + segTo.transportation + '</span>',
                  map: map
                });
              }
            }
          }
          // 区域叠加：直接用 path.json 预加载的 county_areas 边界画半透明多边形
          // （数据由 Python 从阿里 DataV GeoAtlas 按 adcode 预取，不再运行时查询 DistrictSearch）
          (function drawCountyAreas() {
            // 边界数据来自独立文件 county.json（Python 脚本 fetch_county.py 生成）
            var countyAreas = (countyFile && countyFile.county_areas) || {};
            var countyNames = Object.keys(countyAreas);
            if (!countyNames.length) return;
            var usedC = {};
            function countyColor() {
              // 从 16 色取未用色，淡化 55%
              var bg = null, guard = 0;
              while (!bg || usedC[bg]) {
                var tmp = document.createElement("div");
                tmp.className = "c" + (Math.floor(Math.random() * 16) + 1);
                tmp.style.display = "none";
                document.body.appendChild(tmp);
                bg = getComputedStyle(tmp).backgroundColor;
                document.body.removeChild(tmp);
                if (++guard > 30) break;
              }
              usedC[bg] = true;
              return fadeWithWhite(bg, 0.55);
            }
            countyNames.forEach(function (cn) {
              var area = countyAreas[cn];
              if (!area || !area.boundaries || !area.boundaries.length) return;
              var fill = countyColor();
              area.boundaries.forEach(function (ring) {
                new AMap.Polygon({
                  path: ring,
                  strokeColor: fill,
                  strokeWeight: 1,
                  strokeOpacity: 0.6,
                  fillColor: fill,
                  fillOpacity: 0.15,
                  zIndex: 1,
                  map: map
                });
              });
            });
          })();
          if (markers.length) {
            // setFitView 自动按所有标记框定视野，比手动 setBounds 更稳
            try { map.setFitView(markers, false, [40, 40, 40, 40]); }
            catch (e) { console.warn("setFitView:", e); }
          }
          // 点地图空白处关闭信息窗
          map.on("click", function () { if (infoWindow) infoWindow.close(); });
          setTimeout(function () { try { map.resize(); } catch (e) { } }, 150);
        }).catch(function (e) { console.error("读取 path.json 失败", e); });
      }

      // 等地图投影“完成”再上点，避免渲染时序导致的 NaN；
      // 同时加一个短定时器兜底（complete 可能已提前触发而漏接）
      if (map) {
        map.on("complete", addPoints);
        setTimeout(addPoints, 600);
      }

      // 尺寸兜底：加载后 & 窗口尺寸变化时重算瓦片
      window.addEventListener("resize", function () { try { map.resize(); } catch (e) { } });
      setTimeout(function () {
        try { map.resize(); } catch (e) { }
      }, 300);
    }
  </script>

  <!-- 高德 JS API：key 已内置，若要换 key 直接改下面 URL 里的 key 参数 -->
  <script crossorigin="anonymous"
    src="https://webapi.amap.com/maps?v=2.0&key=2a061f322f0cbaba1b5bf0a796fc422c&callback=onAMapLoaded"></script>

  <!-- 其余块：从 16 种莫兰迪古典色随机上色（地图块除外） -->
  <script>
    // 其余矩形块：随机上色
    document.querySelectorAll(".block:not(#map-block)").forEach(function (b) {
      var n = Math.floor(Math.random() * 16) + 1;
      b.classList.add("c" + n);
    });

    // 网站大标题（印章式）：主体文字用配色 background 色，偏移阴影用配色 color 色
    var siteTitle = document.getElementById("site-title");
    if (siteTitle) {
      var n = Math.floor(Math.random() * 16) + 1;
      var tmp = document.createElement("div");
      tmp.className = "c" + n;
      tmp.style.display = "none";
      document.body.appendChild(tmp);
      var bg = getComputedStyle(tmp).backgroundColor;
      var fg = getComputedStyle(tmp).color;
      document.body.removeChild(tmp);
      siteTitle.querySelectorAll(".st-col").forEach(function (el) {
        el.style.color = bg;                    // 主体文字 = background 色
        el.style.textShadow = "3px 3px 0 " + fg; // 偏移 = color 色
      });
    }
  </script>

</body>

</html>
