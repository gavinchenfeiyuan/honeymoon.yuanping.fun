<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>矩形块</title>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>

  <!-- 临时版本号：辨认变更用，确认后删掉这一行即可 -->
  <div id="ver"
    style="position:fixed;top:6px;right:8px;z-index:99999;font:12px/1.4 monospace;color:#222;background:rgba(255,255,255,.88);border:1px solid #999;border-radius:4px;padding:3px 6px;pointer-events:none;">
    v1.6</div>

  <div id="debug"></div>

  <!-- 第一块：竖向 4:3 地图画框（行程点位 + 路线） -->
  <section class="block block-first" id="map-block">
    <div id="map-frame">
      <div id="map"></div>
      <div id="map-hint">地图加载中…<br />若空白，请在 index.html 底部填入高德 Web JS API 的 key 与安全密钥</div>
    </div>
  </section>

  <section class="block">BBBB</section>
  <section class="block">CCCC</section>
  <section class="block">DDDD</section>

  <!-- 高德安全密钥：必须在加载 JS API 之前设置 -->
  <script>
    window._AMapSecurityConfig = { securityJsCode: "8fa56ff20532321e38b42a31b32ed125" };
  </script>

  <!-- 地图初始化（高德 JS API 加载完成后回调） -->
  <script>
    // ===== 底图色调工具：跟随边框随机色，但调浅保证可读 =====
    function rgbStrToHsl(rgb) {
      var m = (rgb || "").match(/rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/);
      if (!m) return { h: 45, s: 50, l: 60 };   // 解析失败默认暖金
      var r = +m[1] / 255, g = +m[2] / 255, b = +m[3] / 255;
      var max = Math.max(r, g, b), min = Math.min(r, g, b);
      var h, s, l = (max + min) / 2;
      if (max === min) { h = 0; s = 0; }
      else {
        var d = max - min;
        s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
        if (max === r) h = (g - b) / d + (g < b ? 6 : 0);
        else if (max === g) h = (b - r) / d + 2;
        else h = (r - g) / d + 4;
        h *= 60;
      }
      return { h: h, s: s * 100, l: l * 100 };
    }

    function hslToRgb(h, s, l) {
      s /= 100; l /= 100;
      var c = (1 - Math.abs(2 * l - 1)) * s;
      var x = c * (1 - Math.abs((h / 60) % 2 - 1));
      var m = l - c / 2;
      var r = 0, g = 0, b = 0;
      if (h < 60) { r = c; g = x; }
      else if (h < 120) { r = x; g = c; }
      else if (h < 180) { g = c; b = x; }
      else if (h < 240) { g = x; b = c; }
      else if (h < 300) { r = x; b = c; }
      else { r = c; b = x; }
      return "rgb(" + Math.round((r + m) * 255) + "," + Math.round((g + m) * 255) + "," + Math.round((b + m) * 255) + ")";
    }

    // 根据边框色相生成「同色系浅色」底图样式并应用
    function applyMapTint(map, borderRgb) {
      var h = Math.round(rgbStrToHsl(borderRgb).h);
      if (h >= 360) h = 0;
      // 先落到确定可用的浅色预置，保证「浅、可读」
      try { map.setMapStyle("amap://styles/whitesmoke"); } catch (e) { }
      // 再用同色系浅色样式覆盖（高饱和度、高亮度 → 底图很淡，红点红线更醒目）
      var styleObj = {
        styleJson: [
          { featureType: "land", elementType: "all", stylers: { color: hslToRgb(h, 30, 95) } },
          { featureType: "water", elementType: "all", stylers: { color: hslToRgb(h, 18, 90) } },
          { featureType: "green", elementType: "all", stylers: { color: hslToRgb(h, 34, 88) } },
          { featureType: "road", elementType: "all", stylers: { color: hslToRgb(h, 10, 97) } },
          { featureType: "building", elementType: "all", stylers: { color: hslToRgb(h, 20, 92) } },
          { featureType: "boundary", elementType: "all", stylers: { color: hslToRgb(h, 14, 82) } }
        ]
      };
      try { map.setMapStyle(styleObj); } catch (e) { }
    }

    function onAMapLoaded() {
      window.__mapOk = true;
      // 显式给出中心点，避免默认中心在极端情况下为 NaN
      var map = new AMap.Map("map", {
        zoom: 5,
        center: [116.397, 39.909],
        viewMode: "2D"
      });
      var hint = document.getElementById("map-hint");
      if (hint) hint.style.display = "none";

      // 底图色调跟随边框随机色（调浅，保证可读）
      var frame = document.getElementById("map-frame");
      var bc = frame ? getComputedStyle(frame).borderColor : "";
      function tint() {
        try { applyMapTint(map, bc); } catch (e) { console.warn("底图着色失败:", e); }
      }
      tint();                                       // 立即试一次
      if (map && map.on) map.on("complete", tint);  // complete 后再补一次，确保生效

      var pointsAdded = false;
      function addPoints() {
        if (pointsAdded) return;   // 防止 complete 事件与兜底定时器重复添加
        pointsAdded = true;
        fetch("place.json")
          .then(function (r) {
            if (!r.ok) throw new Error("HTTP " + r.status);
            return r.json();
          })
          .then(function (data) {
            var pts = (data && data.place) || [];
            if (!pts.length) { console.warn("place.json 没有点位"); return; }
            var markers = [];
            var infoWindow = null;
            pts.forEach(function (p, i) {
              var lng = Number(p.lng), lat = Number(p.lat);
              if (!isFinite(lng) || !isFinite(lat)) {
                console.warn("跳过无效坐标 #" + i, p);
                return;
              }
              try {
                var m = new AMap.Marker({
                  position: [lng, lat],
                  title: p.name + (p.location ? " · " + p.location : ""),
                  map: map
                });
                // 点击标记弹出信息窗（显示名称 + 位置）
                m.on("click", function () {
                  if (infoWindow) infoWindow.close();
                  infoWindow = new AMap.InfoWindow({
                    content:
                      '<div style="font:14px/1.6 system-ui,-apple-system,\'Noto Sans SC\',sans-serif;padding:2px 4px;color:#222;">' +
                      '<strong>' + p.name + '</strong>' +
                      (p.location ? '<br>' + p.location : '') +
                      '</div>',
                    offset: new AMap.Pixel(0, -32)
                  });
                  infoWindow.open(map, [lng, lat]);
                });
                markers.push(m);
              } catch (e) {
                console.warn("点位 #" + i + " 创建失败:", e && e.message, p);
              }
            });
            if (markers.length > 1) {
              var path = pts
                .filter(function (p) {
                  var lng = Number(p.lng), lat = Number(p.lat);
                  return isFinite(lng) && isFinite(lat);
                })
                .map(function (p) { return [Number(p.lng), Number(p.lat)]; });
              new AMap.Polyline({
                path: path,
                strokeColor: "#B23A2E",
                strokeWeight: 3,
                strokeOpacity: 0.85,
                map: map
              });
            }
            if (markers.length) {
              // setFitView 自动按所有标记框定视野，比手动 setBounds 更稳
              try { map.setFitView(markers, false, [40, 40, 40, 40]); }
              catch (e) { console.warn("setFitView:", e); }
            }
            // 点地图空白处关闭信息窗
            map.on("click", function () { if (infoWindow) infoWindow.close(); });
            setTimeout(function () { try { map.resize(); } catch (e) { } }, 150);
          })
          .catch(function (e) { console.error("读取 place.json 失败", e); });
      }

      // 等地图投影“完成”再上点，避免渲染时序导致的 NaN；
      // 同时加一个短定时器兜底（complete 可能已提前触发而漏接）
      if (map) {
        map.on("complete", addPoints);
        setTimeout(addPoints, 600);
      }

      // 尺寸兜底：加载后 & 窗口尺寸变化时重算瓦片
      window.addEventListener("resize", function () { try { map.resize(); } catch (e) { } });
      setTimeout(function () {
        try {
          map.resize();
          var s = map.getSize();
          var w = s.getWidth(), h = s.getHeight();
          window.__mapSize = { width: w, height: h };
          if (window.setDebug) setDebug("host: " + location.host + " | 地图 " + w + "x" + h);
        } catch (e) { }
      }, 300);
    }
  </script>

  <!-- 高德 JS API：把 你的高德KEY 换成你自己的 Web 端 JS API key -->
  <!-- crossorigin 让跨域脚本的真实报错暴露出来（否则只显示 Script error.） -->
  <script crossorigin="anonymous"
    src="https://webapi.amap.com/maps?v=2.0&key=2a061f322f0cbaba1b5bf0a796fc422c&callback=onAMapLoaded"
    onerror="window.__mapErr = true;"></script>

  <!-- 调试条 + 加载兜底：把当前访问地址和报错直接显示在屏幕上 -->
  <script>
    var dbg = document.getElementById("debug");
    function setDebug(msg) {
      if (dbg) dbg.textContent = msg;
    }
    setDebug("host: " + location.host + " | key已填");

    // 捕获全局报错（含高德异步错误，如白名单不匹配 USERKEY_PLAT_NOMATCH）
    window.addEventListener("error", function (e) {
      var m = e && (e.message || (e.error && e.error.message) || e.filename) || "未知错误";
      setDebug("host: " + location.host + " | 报错: " + m);
    }, true);
    // 捕获 Promise 拒绝（部分高德错误走这里）
    window.addEventListener("unhandledrejection", function (e) {
      var m = e && e.reason && (e.reason.message || e.reason) || "Promise 错误";
      setDebug("host: " + location.host + " | 报错: " + m);
    });

    // 6 秒后无论是否“初始化成功”，只要屏幕还空白就给出白名单排查
    setTimeout(function () {
      var h = document.getElementById("map-hint");
      var sizeOk = false;
      try { sizeOk = window.__mapSize && window.__mapSize.height > 50; } catch (e) { }
      if (window.__mapOk && sizeOk) return; // 已正常出图
      if (h) {
        h.style.display = "flex";
        h.innerHTML =
          "当前访问地址：<b>" + location.host + "</b><br><br>" +
          "请确认高德 key 的「域名白名单」里有一项<b>完全等于上面这个地址</b>（或它的 IP）。<br>" +
          "手机上 localhost / 127.0.0.1 指向手机自己，连不到电脑服务，请勿用。<br>" +
          "白名单每行一个，不要带 ~~~ 等符号：<br>" +
          "例：<br>192.168.x.x（你电脑局域网 IP）<br>honeymoon.yuanping.fun<br>localhost";
      }
    }, 6000);
  </script>

  <!-- 其余块：从 64 种秋景配色随机上色（地图块除外） -->
  <script>
    // 取 .cN 类对应的背景色（用于给地图边框上色）
    function pickColor(n) {
      var tmp = document.createElement("div");
      tmp.className = "c" + n;
      tmp.style.display = "none";
      document.body.appendChild(tmp);
      var col = getComputedStyle(tmp).backgroundColor;
      document.body.removeChild(tmp);
      return col;
    }

    // 地图画框：厚边框，颜色从 64 色库随机抽
    var mb = document.getElementById("map-frame");
    if (mb) {
      var bn = Math.floor(Math.random() * 64) + 1;
      mb.style.borderColor = pickColor(bn);
    }

    // 其余矩形块：随机上色
    document.querySelectorAll(".block:not(#map-block)").forEach(function (b) {
      var n = Math.floor(Math.random() * 64) + 1;
      b.classList.add("c" + n);
    });
  </script>

</body>

</html>
