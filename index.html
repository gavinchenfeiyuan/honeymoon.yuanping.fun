<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>矩形块</title>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>

  <!-- 第一块：竖向 4:3 地图画框（行程点位 + 路线） -->
  <section class="block block-first" id="map-block">
    <div id="map-frame">
      <div id="map"></div>
      <div id="map-err"></div>
      <div id="map-hint">地图加载中…<br />若长时间空白，请检查网络或高德 key 配置</div>
      <!-- 网站大标题：左下角印章式——漠岭/松桦两列竖排 + 版本号横排落款 -->
      <div id="site-title">
        <span class="st-col">漠岭</span>
        <span class="st-col">松桦</span>
      </div>
      <div id="ver-tag">v0.79</div>
    </div>
  </section>

  <section class="block">BBBB</section>
  <section class="block">CCCC</section>
  <section class="block">DDDD</section>

  <!-- 高德安全密钥：必须在加载 JS API 之前设置 -->
  <script>
    window._AMapSecurityConfig = { securityJsCode: "8fa56ff20532321e38b42a31b32ed125" };
  </script>

  <!-- 地图初始化（高德 JS API 加载完成后回调） -->
  <script>
    function onAMapLoaded() {
      // 显式给出中心点，避免默认中心在极端情况下为 NaN
      var map = new AMap.Map("map", {
        zoom: 5,
        center: [116.397, 39.909],
        viewMode: "2D"
      });
      var hint = document.getElementById("map-hint");
      if (hint) hint.style.display = "none";

      // 底图用浅色预置（远山黛），保证可读
      try { map.setMapStyle("amap://styles/whitesmoke"); } catch (e) { }
      if (map && map.on) map.on("complete", function () {
        try { map.setMapStyle("amap://styles/whitesmoke"); } catch (e) { }
      });

      // 交通方式标签：用 AMap.Text（2.0 原生，继承自 AMap.Marker）。
      // anchor:'center' 让文字几何中心精确落在 position 坐标点，无 DOMOverlay 的插件/像素换算歧义。
      function makeTransportLabel(lnglat, text) {
        // 「；」或「;」触发换行（AMap.Text 需配合 pre-line 才生效）
        text = String(text).replace(/[；;]/g, "\n");
        return new AMap.Text({
          text: text,
          position: [lnglat.getLng(), lnglat.getLat()],
          anchor: "center",
          zIndex: 20,   // 中层：低于点位(30)、高于路径(5/6)，确保交通 emoji 不被路径遮挡
          clickable: false,
          style: {
            "font-size": "11px",
            "line-height": "1.3",
            "color": "#333",
            "white-space": "pre-line",
            "text-shadow": "0 0 2px #fff, 0 0 3px #fff",
            "background": "transparent",
            "padding": "0",
            "border": "none",
            "pointer-events": "none"
          }
        });
      }

      var pointsAdded = false;
      // YYMMDD -> "2026年9月12日"
      function fmtDate(d) {
        if (!d || d.length < 6) return "";
        return (2000 + (+d.slice(0, 2))) + "年" + (+d.slice(2, 4)) + "月" + (+d.slice(4, 6)) + "日";
      }
      function addPoints() {
        if (pointsAdded) return;   // 防止 complete 事件与兜底定时器重复添加
        pointsAdded = true;
        // 同 date 同色：从 16 色配色库随机取底色（不同日期不撞色），再叠蒙版淡化（与白混合）
        var dateColors = {};
        var usedColors = {};
        function fadeWithWhite(rgb, t) {
          var m = (rgb || "").match(/rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/);
          if (!m) return rgb;
          var r = +m[1], g = +m[2], b = +m[3];
          var nr = Math.round(r + (255 - r) * t);
          var ng = Math.round(g + (255 - g) * t);
          var nb = Math.round(b + (255 - b) * t);
          return "rgb(" + nr + "," + ng + "," + nb + ")";
        }
        function colorOf(date) {
          if (!dateColors[date]) {
            var bg = null, guard = 0;
            while (!bg || usedColors[bg]) {
              var tmp = document.createElement("div");
              tmp.className = "c" + (Math.floor(Math.random() * 16) + 1);
              tmp.style.display = "none";
              document.body.appendChild(tmp);
              bg = getComputedStyle(tmp).backgroundColor;
              document.body.removeChild(tmp);
              if (++guard > 30) break;   // 兜底：色表用尽时不再强求不撞色
            }
            usedColors[bg] = true;
            dateColors[date] = fadeWithWhite(bg, 0.5);   // 叠 50% 白色蒙版淡化
          }
          return dateColors[date];
        }
        // 并行加载：path.json（plan 点位）+ county.json（county 行政边界）
        Promise.all([
          fetch("path.json").then(function (r) {
            if (!r.ok) throw new Error("path.json HTTP " + r.status);
            return r.json();
          }),
          fetch("county.json").then(function (r) {
            if (!r.ok) throw new Error("county.json HTTP " + r.status);
            return r.json();
          }).catch(function () { return {}; })   // county.json 缺失不阻塞地图
        ]).then(function (results) {
          var data = results[0];
          var countyFile = results[1] || {};
          var plan = (data && data.plan) || [];
          if (!plan.length) { console.warn("path.json 没有 plan"); return; }
          var markers = [];
          var popMarker = null;   // 自定义弹层（AMap.Marker 承载，替代 InfoWindow，避免默认灰框）
          var bad = [];       // coordinate 缺失/格式异常的点
          var dayPoints = []; // {lng,lat,date} 按 plan 顺序，用于绘制路线
          // 严格按 plan 顺序打点
          plan.forEach(function (item, i) {
            var name = item && item.name;
            if (!name) return;
            var parts = String(item.coordinate || "").split(",");
            var lng = Number(parts[0]), lat = Number(parts[1]);
            if (!isFinite(lng) || !isFinite(lat)) {
              bad.push(name);
              console.error("plan 点位「" + name + "」(#" + i + ") coordinate 无效", item.coordinate);
              return;
            }
            try {
              // 地名背景框颜色：同 date 同色（淡化后）
              var dayColor = colorOf(String(item.date || "").slice(0, 6));
              var ZOOM_NAME_MIN = 8;   // zoom >= 8 显示具体点位名
              var dotHtml = '<span class="map-dot' + (item.arrived ? ' arrived' : '') + '"></span>';
              // overnight: true 的点默认（全 zoom 段）显示 name；否则放大到 zoom >= 8 才显示
              var zooms = (item.overnight === true) ? [3, 20] : [ZOOM_NAME_MIN, 20];

              // 点位名字下方的日期/时间行：time 非空 → "10:45 9/12"，否则 → "9/12"
              var t = String(item.time || "").trim();
              var d = String(item.date || "").slice(0, 6);
              var timeLine = "";
              if (d.length === 6) {
                var mm = (+d.slice(2, 4)) + "";
                var dd = (+d.slice(4, 6)) + "";
                var tLine = t.length === 4 ? " " + t.slice(0, 2) + ":" + t.slice(2, 4) : "";
                timeLine = mm + "/" + dd + tLine;
              }

              var m = new AMap.Marker({
                position: [lng, lat],
                anchor: "bottom-center",
                zIndex: 30,   // 点位信息最顶层：高于 transportation(20) 与路径(5/6)
                zooms: zooms,
                content:
                  '<div class="map-dot-wrap">' +
                  '<span class="map-dot-name" style="background:' + dayColor + '">' +
                  (item.overnight === true ? '🌛' : '') + name + '</span>' +
                  (timeLine ? '<span class="map-dot-time">' + timeLine + '</span>' : "") +
                  dotHtml +
                  '</div>',
                map: map
              });

              // 点击标记弹出信息窗（名称 + 行政区划 + 日期时间 + 备注）
              m.on("click", function () {
                if (popMarker) { popMarker.setMap(null); popMarker = null; }

                var dateFull = item.date ? fmtDate(item.date) : "";
                var tt = String(item.time || "").trim();
                var timeTxt = tt.length === 4 ? tt.slice(0, 2) + ":" + tt.slice(2, 4) : "";
                var arrived = item.arrived === true;

                // 信息项：icon + label + value（日期时间只放头部 badge，不在此重复）
                function row(icon, label, val) {
                  if (!val) return "";
                  return '<div class="iw-row">' +
                    '<div class="iw-ico">' + icon + '</div>' +
                    '<div class="iw-meta">' +
                    '<div class="iw-label">' + label + '</div>' +
                    '<div class="iw-val">' + val + '</div>' +
                    '</div></div>';
                }

                var locVal = [item.county, item.city].filter(Boolean).join("·");
                var infoRows =
                  (locVal ? row("🗺", "区域", locVal) : "") +
                  // 备注：仅显示内容，不带图标与 label；「，」「；」「;」或「\n」触发换行
                  (item.note
                    ? '<div class="iw-note">' + String(item.note).replace(/[，；;]/g, "\n") + '</div>'
                    : "");

                // 头部徽章：日期/时间
                var badgeParts = [];
                if (dateFull) badgeParts.push(dateFull);
                if (timeTxt) badgeParts.push(timeTxt);
                var badge = badgeParts.length
                  ? '<div class="iw-badge">' + badgeParts.join(" · ") + '</div>' : "";

                var body =
                  '<div class="iw-card' + (arrived ? ' is-arrived' : '') + '" style="--iw-tint:' + dayColor + '">' +
                  '<div class="iw-hero">' +
                  '<div class="iw-hero-inner">' +
                  '<div class="iw-title">' + (item.overnight === true ? '🌛' : '') + name + '</div>' +
                  badge +
                  '</div>' +
                  '</div>' +
                  '<div class="iw-body">' + infoRows + '</div>' +
                  '</div>';

                // 用 AMap.Marker 承载自定义弹层：无高德默认皮肤/灰框
                popMarker = new AMap.Marker({
                  position: [lng, lat],
                  anchor: "bottom-center",
                  offset: new AMap.Pixel(0, 24),   // 卡片底部锚点在点上，上移使卡片浮于点上
                  zIndex: 50,
                  content: body,
                  map: map
                });
              });
              markers.push(m);
              dayPoints.push({
                lng: lng,
                lat: lat,
                date: String(item.date || "").slice(0, 6),   // 归一化为 YYMMDD
                arrived: item.arrived === true,
                transportation: String(item.transportation || "").trim(),
                time: String(item.time || "").trim()
              });
            } catch (e) {
              console.warn("点位「" + name + "」创建失败:", e && e.message);
            }
          });
          // 无效坐标点位：控制台报错 + 地图底部红字提示
          if (bad.length) {
            var errEl = document.getElementById("map-err");
            if (errEl) {
              errEl.style.display = "block";
              errEl.textContent = bad.length + " 个点位 coordinate 无效：" + bad.join("、");
            }
            console.error("无效坐标点位汇总：", bad);
          }
          // 路线：简单直线折线。相邻点位连直线，按 arrived 连续段分组着色。
          if (dayPoints.length > 1) {
            var ROUTE_TODO = "#3A9268";   // 未走：林海翠（夏·落叶松）
            var ROUTE_DONE = "#E0A62E";   // 已走：松金（秋·落叶松）
            // 把连续同 arrived 的点位收拢成一组 [[lng,lat],...]
            var segs = [];
            for (var si = 0; si < dayPoints.length - 1; si++) {
              var from = dayPoints[si], to = dayPoints[si + 1];
              var arrived = from.arrived;
              var last = segs[segs.length - 1];
              if (last && last.arrived === arrived && last.pts[last.pts.length - 1][0] === from.lng &&
                  last.pts[last.pts.length - 1][1] === from.lat) {
                last.pts.push([to.lng, to.lat]);
              } else {
                segs.push({ arrived: arrived, pts: [[from.lng, from.lat], [to.lng, to.lat]] });
              }
            }
            for (var gj = 0; gj < segs.length; gj++) {
              var g = segs[gj];
              new AMap.Polyline({
                path: g.pts,
                strokeColor: g.arrived ? ROUTE_DONE : ROUTE_TODO,
                strokeWeight: g.arrived ? 4 : 3,
                strokeOpacity: 0.85,
                strokeStyle: "solid",
                zIndex: g.arrived ? 6 : 5,
                map: map
              });
            }
            // 交通方式：plan.transportation 非空时，显示在该点前面进入线路的正中间
            for (var ti = 0; ti < dayPoints.length - 1; ti++) {
              var f2 = dayPoints[ti], t2 = dayPoints[ti + 1];
              if (t2.transportation) {
                try {
                  var midLng = (f2.lng + t2.lng) / 2;
                  var midLat = (f2.lat + t2.lat) / 2;
                  var lbl = makeTransportLabel(new AMap.LngLat(midLng, midLat), t2.transportation);
                  map.add(lbl);
                } catch (e) {
                  console.warn("交通标签创建失败（不影响点位/路线）:", e && e.message);
                }
              }
            }
          }
          // 区域叠加：直接用 path.json 预加载的 county_areas 边界画半透明多边形
          // （数据由 Python 从阿里 DataV GeoAtlas 按 adcode 预取，不再运行时查询 DistrictSearch）
          (function drawCountyAreas() {
            // 边界数据来自独立文件 county.json（Python 脚本 fetch_county.py 生成）
            var countyAreas = (countyFile && countyFile.county_areas) || {};
            var countyNames = Object.keys(countyAreas);
            if (!countyNames.length) return;
            var usedC = {};
            function countyColor() {
              // 从 16 色取未用色，淡化 55%
              var bg = null, guard = 0;
              while (!bg || usedC[bg]) {
                var tmp = document.createElement("div");
                tmp.className = "c" + (Math.floor(Math.random() * 16) + 1);
                tmp.style.display = "none";
                document.body.appendChild(tmp);
                bg = getComputedStyle(tmp).backgroundColor;
                document.body.removeChild(tmp);
                if (++guard > 30) break;
              }
              usedC[bg] = true;
              return fadeWithWhite(bg, 0.55);
            }
            countyNames.forEach(function (cn) {
              var area = countyAreas[cn];
              if (!area || !area.boundaries || !area.boundaries.length) return;
              var fill = countyColor();
              area.boundaries.forEach(function (ring) {
                new AMap.Polygon({
                  path: ring,
                  strokeColor: fill,
                  strokeWeight: 1,
                  strokeOpacity: 0.6,
                  fillColor: fill,
                  fillOpacity: 0.15,
                  zIndex: 1,
                  map: map
                });
              });
            });
          })();
          if (markers.length) {
            // setFitView 自动按所有标记框定视野，比手动 setBounds 更稳
            try { map.setFitView(markers, false, [40, 40, 40, 40]); }
            catch (e) { console.warn("setFitView:", e); }
          }
          // 点地图空白处关闭信息窗
          map.on("click", function () { if (popMarker) { popMarker.setMap(null); popMarker = null; } });
          setTimeout(function () { try { map.resize(); } catch (e) { } }, 150);
        }).catch(function (e) { console.error("读取 path.json 失败", e); });
      }

      // 等地图投影“完成”再上点，避免渲染时序导致的 NaN；
      // 同时加一个短定时器兜底（complete 可能已提前触发而漏接）
      if (map) {
        map.on("complete", addPoints);
        setTimeout(addPoints, 600);
      }

      // 尺寸兜底：加载后 & 窗口尺寸变化时重算瓦片
      window.addEventListener("resize", function () { try { map.resize(); } catch (e) { } });
      setTimeout(function () {
        try { map.resize(); } catch (e) { }
      }, 300);
    }
  </script>

  <!-- 高德 JS API：key 已内置，若要换 key 直接改下面 URL 里的 key 参数。 -->
  <script crossorigin="anonymous"
    src="https://webapi.amap.com/maps?v=2.0&key=2a061f322f0cbaba1b5bf0a796fc422c&callback=onAMapLoaded"></script>

  <!-- 其余块：从 16 种莫兰迪古典色随机上色（地图块除外） -->
  <script>
    // 其余矩形块：随机上色
    document.querySelectorAll(".block:not(#map-block)").forEach(function (b) {
      var n = Math.floor(Math.random() * 16) + 1;
      b.classList.add("c" + n);
    });

    // 网站大标题（印章式）：主体文字用配色 background 色，偏移阴影用配色 color 色
    var siteTitle = document.getElementById("site-title");
    if (siteTitle) {
      var n = Math.floor(Math.random() * 16) + 1;
      var tmp = document.createElement("div");
      tmp.className = "c" + n;
      tmp.style.display = "none";
      document.body.appendChild(tmp);
      var bg = getComputedStyle(tmp).backgroundColor;
      var fg = getComputedStyle(tmp).color;
      document.body.removeChild(tmp);
      siteTitle.querySelectorAll(".st-col").forEach(function (el) {
        el.style.color = bg;                    // 主体文字 = background 色
        el.style.textShadow = "3px 3px 0 " + fg; // 偏移 = color 色
      });
    }
  </script>

</body>

</html>
